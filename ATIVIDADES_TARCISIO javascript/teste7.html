<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

console.log("--- PARTE 1: if/else ---");

let idade = 20; 

if (idade >= 18) {
    console.log("Pode dirigir");
} else {
    console.log("Não pode dirigir");
}

console.log("\n");

console.log("--- PARTE 2: else if ---");

let nota = 6.5;
if (nota >= 7) {
    console.log("Aprovado");
} else if (nota >= 5) { 
    console.log("Recuperação");
} else {
    console.log("Reprovado");
}

console.log("\n");

console.log("--- PARTE 3: switch ---");

let dia = 2; 

switch (dia) {
    case 1:
        console.log("Domingo");
        break;
        console.log("Segunda");
        break;
    case 3:
        console.log("Terça");
        break;
    default:
        console.log("Dia inválido");
}
    </script>
</body>
</html>
